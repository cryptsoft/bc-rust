[package]
name = "bouncycastle-rng"
version = "0.1.1"
edition = "2018"

[workspace]

[features]
default = ["std", "os_rng"]
std = [
    "bouncycastle-core-interface/std",
    "bouncycastle-sha2/std",
    "bouncycastle-utils/std",
]
os_rng = ["getrandom"]

[dependencies]
bouncycastle-core-interface = { path = "../core-interface", version = "0.1.1", default-features = false }
bouncycastle-sha2 = { path = "../sha2", version = "0.1.1", default-features = false }
bouncycastle-utils = { path = "../utils", version = "0.1.1", default-features = false }

# external
getrandom = { version = "0.2", optional = true }